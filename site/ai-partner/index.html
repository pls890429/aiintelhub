<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI不是工具，是我的作战搭档</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif; background: #0d1117; color: #e6edf3; }

    /* ── Top Bar ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 56px;
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
    }
    .header-brand {
      display: flex; align-items: center; gap: 10px;
    }
    .header-brand .icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .header-brand h1 {
      font-size: 16px; font-weight: 600;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }
    .header-actions {
      display: flex; align-items: center; gap: 12px;
    }
    .btn-download {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 16px; border-radius: 6px;
      background: rgba(37, 99, 235, 0.2); border: 1px solid rgba(37, 99, 235, 0.5);
      color: #60a5fa; font-size: 13px; font-weight: 500;
      text-decoration: none; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-download:hover { background: rgba(37, 99, 235, 0.35); }

    /* ── Main PDF Viewer ── */
    main {
      padding-top: 56px;
      height: 100vh;
      display: flex; flex-direction: column;
    }
    .pdf-container {
      flex: 1;
      width: 100%;
      background: #161b22;
    }
    .pdf-container embed,
    .pdf-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Fallback message */
    .pdf-fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      color: #8b949e;
    }
    .pdf-fallback .fallback-icon { font-size: 48px; }
    .pdf-fallback p { font-size: 15px; }
    .pdf-fallback a {
      padding: 10px 24px; border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff; text-decoration: none; font-weight: 600;
    }

    /* ── AI Chat Floating Button ── */
    #ai-fab {
      position: fixed; bottom: 28px; right: 28px; z-index: 999;
      width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border: none; cursor: pointer;
      box-shadow: 0 4px 24px rgba(37,99,235,0.5);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
      color: #fff; font-size: 22px;
    }
    #ai-fab:hover { transform: scale(1.08); box-shadow: 0 6px 32px rgba(37,99,235,0.7); }
    #ai-fab .fab-badge {
      position: absolute; top: -2px; right: -2px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #22c55e; border: 2px solid #0d1117;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.2); }
    }

    /* ── AI Chat Panel ── */
    #ai-panel {
      position: fixed; bottom: 96px; right: 28px; z-index: 998;
      width: 380px; max-height: 560px;
      background: #161b22;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: scale(0.9) translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s;
    }
    #ai-panel.open {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: all;
    }

    /* Panel Header */
    .panel-header {
      padding: 16px 18px 12px;
      background: linear-gradient(135deg, rgba(37,99,235,0.15), rgba(124,58,237,0.15));
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-header-left { display: flex; align-items: center; gap: 10px; }
    .panel-avatar {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .panel-title { font-size: 14px; font-weight: 600; color: #e6edf3; }
    .panel-subtitle { font-size: 11px; color: #8b949e; margin-top: 1px; }
    .panel-close {
      background: none; border: none; color: #8b949e;
      font-size: 18px; cursor: pointer; padding: 4px;
      border-radius: 4px; transition: color 0.2s;
    }
    .panel-close:hover { color: #e6edf3; }

    /* Messages */
    .panel-messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
      min-height: 0;
    }
    .panel-messages::-webkit-scrollbar { width: 4px; }
    .panel-messages::-webkit-scrollbar-track { background: transparent; }
    .panel-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    .msg { display: flex; gap: 8px; align-items: flex-start; }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .msg.ai .msg-avatar { background: linear-gradient(135deg, #2563eb, #7c3aed); }
    .msg.user .msg-avatar { background: rgba(255,255,255,0.1); }
    .msg-bubble {
      max-width: 78%; padding: 10px 13px;
      border-radius: 12px; font-size: 13px; line-height: 1.6;
      word-break: break-word;
    }
    .msg.ai .msg-bubble {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: #e6edf3;
      border-top-left-radius: 4px;
    }
    .msg.user .msg-bubble {
      background: linear-gradient(135deg, rgba(37,99,235,0.4), rgba(124,58,237,0.4));
      border: 1px solid rgba(37,99,235,0.3);
      color: #e6edf3;
      border-top-right-radius: 4px;
    }

    /* Typing indicator */
    .typing-dots { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: #8b949e; display: inline-block;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Quick prompts */
    .quick-prompts {
      padding: 0 16px 10px;
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .quick-btn {
      padding: 5px 10px; border-radius: 20px;
      background: rgba(37,99,235,0.12); border: 1px solid rgba(37,99,235,0.3);
      color: #60a5fa; font-size: 11px; cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .quick-btn:hover { background: rgba(37,99,235,0.25); }

    /* Input area */
    .panel-input {
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,0.07);
      display: flex; gap: 8px; align-items: flex-end;
    }
    .panel-input textarea {
      flex: 1; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 9px 12px;
      color: #e6edf3; font-size: 13px; resize: none;
      outline: none; font-family: inherit;
      max-height: 100px; min-height: 38px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }
    .panel-input textarea:focus { border-color: rgba(37,99,235,0.5); }
    .panel-input textarea::placeholder { color: #484f58; }
    .send-btn {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 15px;
      transition: opacity 0.2s, transform 0.15s;
    }
    .send-btn:hover { opacity: 0.85; transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* Responsive */
    @media (max-width: 480px) {
      #ai-panel { width: calc(100vw - 24px); right: 12px; bottom: 80px; }
      #ai-fab { bottom: 16px; right: 16px; }
    }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="header-brand">
    <div class="icon">🤖</div>
    <h1>AI不是工具，是我的作战搭档</h1>
  </div>
  <div class="header-actions">
    <a class="btn-download" href="ai-partner.pdf" download>
      ⬇ 下载PDF
    </a>
  </div>
</header>

<!-- ── PDF Viewer ── -->
<main>
  <div class="pdf-container" id="pdfContainer">
    <embed
      id="pdfEmbed"
      src="ai-partner.pdf#toolbar=1&navpanes=0&scrollbar=1&view=FitH"
      type="application/pdf"
      width="100%"
      height="100%"
    />
    <div class="pdf-fallback" id="pdfFallback">
      <div class="fallback-icon">📄</div>
      <p>您的浏览器不支持内嵌PDF预览</p>
      <a href="ai-partner.pdf" target="_blank">点击在新标签页打开</a>
    </div>
  </div>
</main>

<!-- ── AI Chat FAB ── -->
<button id="ai-fab" onclick="togglePanel()" title="AI作战搭档">
  🤖
  <span class="fab-badge"></span>
</button>

<!-- ── AI Chat Panel ── -->
<div id="ai-panel">
  <div class="panel-header">
    <div class="panel-header-left">
      <div class="panel-avatar">🤖</div>
      <div>
        <div class="panel-title">AI作战搭档</div>
        <div class="panel-subtitle">在线 · 随时为您解答</div>
      </div>
    </div>
    <button class="panel-close" onclick="togglePanel()">✕</button>
  </div>

  <div class="panel-messages" id="messages">
    <div class="msg ai">
      <div class="msg-avatar">🤖</div>
      <div class="msg-bubble">
        你好！我是你的AI作战搭档 👋<br><br>
        我可以帮你深入解读这份《AI不是工具，是我的作战搭档》演讲内容，回答关于AI在销售、竞争情报、客户洞察等场景的应用问题。<br><br>
        有什么想聊的？
      </div>
    </div>
  </div>

  <div class="quick-prompts" id="quickPrompts">
    <button class="quick-btn" onclick="sendQuick(this)">AI如何辅助销售？</button>
    <button class="quick-btn" onclick="sendQuick(this)">竞争情报怎么用AI做？</button>
    <button class="quick-btn" onclick="sendQuick(this)">AI提效的核心场景？</button>
    <button class="quick-btn" onclick="sendQuick(this)">如何说服客户用AI？</button>
  </div>

  <div class="panel-input">
    <textarea
      id="chatInput"
      placeholder="输入问题，按 Enter 发送…"
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  // ── Panel toggle ──
  let panelOpen = false;
  function togglePanel() {
    panelOpen = !panelOpen;
    document.getElementById('ai-panel').classList.toggle('open', panelOpen);
    if (panelOpen) {
      setTimeout(() => document.getElementById('chatInput').focus(), 300);
    }
  }

  // ── Auto-resize textarea ──
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  // ── Enter key handler ──
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  // ── Quick prompt ──
  function sendQuick(btn) {
    document.getElementById('chatInput').value = btn.textContent;
    sendMessage();
  }

  // ── Send message ──
  async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true;

    // Hide quick prompts after first use
    document.getElementById('quickPrompts').style.display = 'none';

    appendMsg('user', text);
    const typingId = appendTyping();

    try {
      const reply = await callAI(text);
      removeTyping(typingId);
      appendMsg('ai', reply);
    } catch (e) {
      removeTyping(typingId);
      appendMsg('ai', '抱歉，暂时无法连接AI服务，请稍后重试。');
    }

    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }

  // ── Append message ──
  function appendMsg(role, text) {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="msg-avatar">${role === 'ai' ? '🤖' : '👤'}</div>
      <div class="msg-bubble">${escapeHtml(text).replace(/\n/g, '<br>')}</div>
    `;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  // ── Typing indicator ──
  let typingCounter = 0;
  function appendTyping() {
    const id = 'typing-' + (++typingCounter);
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg ai'; div.id = id;
    div.innerHTML = `
      <div class="msg-avatar">🤖</div>
      <div class="msg-bubble">
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>
    `;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return id;
  }
  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  // ── Escape HTML ──
  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Conversation history ──
  const history = [];

  // ── Call AI (OpenAI-compatible) ──
  async function callAI(userMsg) {
    history.push({ role: 'user', content: userMsg });

    const systemPrompt = `你是"AI作战搭档"，一个专注于帮助云计算解决方案销售（特别是华为云销售）利用AI提升战斗力的智能助手。

你的知识背景：
- 深度理解《AI不是工具，是我的作战搭档》演讲核心观点：AI是销售的作战搭档而非简单工具
- 熟悉AI在销售场景的应用：竞争情报收集、客户洞察、方案撰写、话术优化、会议纪要等
- 了解华为云、阿里云、腾讯云、火山云等主要云厂商的竞争态势
- 关注浙江区域企业数字化转型需求

回答风格：
- 简洁有力，直击要点，不废话
- 结合实际销售场景给出可操作建议
- 适当使用结构化输出（分点、分段）
- 语气专业但不刻板，像一个经验丰富的战友

请用中文回答。`;

    const messages = [
      { role: 'system', content: systemPrompt },
      ...history.slice(-10)
    ];

    const resp = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer PLACEHOLDER_KEY'
      },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        messages,
        max_tokens: 600,
        temperature: 0.7
      })
    });

    if (!resp.ok) throw new Error('API error');
    const data = await resp.json();
    const reply = data.choices[0].message.content;
    history.push({ role: 'assistant', content: reply });
    return reply;
  }

  // ── PDF embed fallback detection ──
  window.addEventListener('load', () => {
    const embed = document.getElementById('pdfEmbed');
    // On mobile or unsupported browsers, show fallback
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isMobile) {
      embed.style.display = 'none';
      const fallback = document.getElementById('pdfFallback');
      fallback.style.display = 'flex';
    }
  });
</script>
</body>
</html>
